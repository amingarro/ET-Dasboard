name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run lint

      # `next build` and `build:electron` (both run by `npm run build`)
      # already fail on any type error in the renderer/main process
      # respectively — a separate standalone `tsc --noEmit` step before this
      # would actually be *wrong*, not just redundant: Next 16's typed
      # routes (tsconfig.json's `out/dev/types/**/*.ts` — see next.config.ts's
      # distDir) are generated by `next build`/`next dev` itself and are
      # gitignored, so a bare `tsc --noEmit` on a fresh checkout fails with
      # "Cannot find name 'LayoutProps'" before that generation ever happens.
      - run: npm run build

      - run: npm test
