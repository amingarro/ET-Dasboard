name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-changelog-version.sh (below) needs to diff against the
          # commit/branch this push or PR started from — a shallow clone
          # wouldn't have it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Right after every release, CHANGELOG.md's top entry legitimately IS
      # the version that was just tagged — that's the normal resting state,
      # not a bug. Only run the check when this push/PR actually touches
      # CHANGELOG.md, i.e. someone is adding to it right now; otherwise
      # every single CI run between releases would fail for no reason.
      - name: Check changelog version
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if git diff --name-only "$BASE" HEAD -- CHANGELOG.md | grep -q .; then
            npm run check:changelog
          else
            echo "CHANGELOG.md unchanged since $BASE — skipping."
          fi

      - run: npm run lint

      # `next build` and `build:electron` (both run by `npm run build`)
      # already fail on any type error in the renderer/main process
      # respectively — a separate standalone `tsc --noEmit` step before this
      # would actually be *wrong*, not just redundant: Next 16's typed
      # routes (tsconfig.json's `out/dev/types/**/*.ts` — see next.config.ts's
      # distDir) are generated by `next build`/`next dev` itself and are
      # gitignored, so a bare `tsc --noEmit` on a fresh checkout fails with
      # "Cannot find name 'LayoutProps'" before that generation ever happens.
      - run: npm run build

      - run: npm test
